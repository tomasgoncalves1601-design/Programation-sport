<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programa Deportivo · S1</title>
<style>
:root{--ink:#17212b;--muted:#758192;--paper:#f5f7fb;--surface:#ffffff;--line:#e8edf3;--brand:#3563e9;--shadow:0 10px 28px rgba(28,45,74,.09)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7f9ff,#f6f8f6);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.hero{max-width:1500px;margin:auto;padding:28px 28px 12px;display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--brand);text-transform:uppercase}.hero h1{font-size:30px;letter-spacing:-1px;margin:4px 0}.hero p{margin:0;color:var(--muted);font-size:14px}.week{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:10px 14px;text-align:center;min-width:130px}.week strong{display:block;font-size:17px}.week span{font-size:11px;color:var(--muted)}
.tools{max-width:1500px;margin:0 auto 14px;padding:0 28px;display:flex;justify-content:space-between;align-items:center;gap:10px}.hint{font-size:13px;color:var(--muted)}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer;font-size:13px}.primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(53,99,233,.28)}.ghost{background:#fff;border:1px solid var(--line);color:#536170}.message{max-width:1500px;margin:0 auto;padding:0 28px;color:#20864a;font-size:13px;height:20px}
.board-wrap{padding:0 20px 28px}.board{max-width:1500px;margin:auto;display:grid;grid-template-columns:repeat(7,minmax(205px,1fr));overflow-x:auto;border-radius:18px;box-shadow:var(--shadow);background:var(--surface);border:1px solid var(--line)}
.day{min-width:205px;display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:650px}.day:last-child{border-right:0}.day-head{padding:15px 12px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}.dot{width:9px;height:9px;border-radius:50%;background:var(--brand)}.day-name{font-weight:800;font-size:15px;letter-spacing:-.2px}.day-sub{font-size:11px;color:var(--muted);margin-left:auto}.sessions{padding:8px;flex:1}.session{--accent:#3875bd;--tint:#edf5fc;--tint-line:#d4e7f7;margin-bottom:10px;border:1px solid var(--tint-line);border-radius:12px;overflow:hidden;background:#fff}.session.blue{--accent:#2878c9;--tint:#edf5fc;--tint-line:#cfe4f7}.session.red{--accent:#c44f5b;--tint:#fff0f2;--tint-line:#f4d2d7}.session.green{--accent:#2f9870;--tint:#ecf9f2;--tint-line:#cfeede}.session.purple{--accent:#805bb1;--tint:#f5effc;--tint-line:#e1d4f4}.session-title{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;background:var(--tint);font-size:11px;font-weight:850;letter-spacing:.08em;color:var(--accent);gap:7px}.title-edit{flex:1;outline:none}.color-picker{display:flex;gap:4px;align-items:center}.color-dot{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px #cbd3de;cursor:pointer;padding:0}.color-dot.selected{box-shadow:0 0 0 2px var(--accent),0 0 0 3px #fff;transform:scale(1.12)}.color-dot.blue{background:#2878c9}.color-dot.red{background:#c44f5b}.color-dot.green{background:#2f9870}.color-dot.purple{background:#805bb1}.cols,.entry{display:grid;grid-template-columns:1.7fr 1fr .72fr}.cols{padding:6px 8px 4px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.entry{border-top:1px solid #f0f3f6}.entry>div{min-width:0;padding:8px;font-size:12px;line-height:1.15;border-right:1px solid #f0f3f6;outline:none}.entry>div:last-child{border-right:0}.entry>div:focus{background:#fff4c7}.session-footer{display:flex;align-items:center;justify-content:space-between;padding:7px;background:#fafbfd;border-top:1px solid #f0f3f6}.mini{border:0;background:transparent;color:var(--accent);font-weight:750;cursor:pointer;font-size:11px;padding:3px}.remove{color:#c03b48}.add-session{margin:0 8px 10px;width:calc(100% - 16px);padding:9px;border:1px dashed #cbd6e4;border-radius:10px;background:#f8fbff;color:#50709a;font-weight:750;font-size:12px;cursor:pointer}.legend{max-width:1500px;margin:0 auto 26px;padding:0 28px;display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}@media(max-width:720px){.hero{padding:20px 16px 10px}.hero h1{font-size:24px}.week{display:none}.tools,.message{padding-left:16px;padding-right:16px}.hint{display:none}.board-wrap{padding:0 12px 20px}.board{grid-template-columns:repeat(7,245px);border-radius:14px}.day{min-width:245px}.legend{padding:0 16px}.btn{padding:10px}.day{min-height:670px}}
</style>
</head>
<body>
<header class="hero"><div><div class="eyebrow">Entrenamiento personal</div><h1>Programa deportivo</h1><p>Semana 1 · Plan editable de fuerza, prevención y cardio</p></div><div class="week"><strong>SEMANA 01</strong><span>Tu planificación</span></div></header>
<div class="tools"><div class="hint">Edita una celda directamente. Usa los 4 círculos para elegir el color de cada sesión.</div><div class="actions"><button class="btn ghost" id="reset">Restablecer</button><button class="btn primary" id="save">Guardar cambios</button></div></div><div class="message" id="message"></div>
<main class="board-wrap"><section class="board" id="board"></section></main>
<div class="legend"><span style="--c:#2878c9">Azul</span><span style="--c:#c44f5b">Rojo</span><span style="--c:#2f9870">Verde</span><span style="--c:#805bb1">Morado</span></div>
<script>
const DEFAULT={"days":["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"],"schedule":{"Lundi":[{"label":"SEANCE 1","color":"blue","rows":[["Press assis","4×10 (2)","25"],["Press incline","4×10 (2)","30"],["Press militaire","4×10 (2)","22,5"],["Dips","4×10 (2)","60"],["Elevation lateral","4×10 (2)","10"],["Extention coude","4×10 (2)","12,5"]]},{"label":"SEANCE 2","color":"green","rows":[["Velo","30 min","Z2"]]}],"Mardi":[{"label":"SEANCE 1","color":"blue","rows":[["Tirage vertical","4×10 (2)","50"],["Tirage horizontal","4×10 (2)","50"],["Extention epaule","4×10 (2)","42,5"],["Face pull","4×10 (2)","60"],["Biceps curl","3×10 (2)","10"],["Curl marteau","3×10 (2)","10"]]},{"label":"SEANCE 2","color":"purple","rows":[["Press pallof","3×10 (1)","22"],["Incline kettle","3×10 (1)","20"],["Cruch poulie","3×10 (1)","50"],["Extention colone","3×10 (1)","12"]]}],"Mercredi":[{"label":"SEANCE 1","color":"red","rows":[["Squat","4×10 (3)",""],["RDL","4×10 (3)",""],["Hip trust","4×10 (3)",""],["Extention cuadri","4×10 (3)",""],["Curl jambe","4×10 (3)",""],["Flexion plantaire","4×10 (3)",""],["Soleaire","4×10 (3)",""],["Bulgares","3×10 (3)",""]]}],"Jeudi":[{"label":"SEANCE 1","color":"blue","rows":[["Press assis","4×10 (2)",""],["Papillon","4×10 (2)",""],["Press militaire","4×10 (2)",""],["Dips","4×10 (2)",""],["Elevation lateral","4×10 (2)",""],["Extention coude","4×10 (2)",""]]}],"Vendredi":[{"label":"SEANCE 1","color":"blue","rows":[["Tirage vertical","4×10 (2)",""],["Tirage horizontal","4×10 (2)",""],["Extention epaule","4×10 (2)",""],["Face pull","4×10 (2)",""],["Biceps curl","3×10 (2)",""],["Curl marteau","3×10 (2)",""]]},{"label":"SEANCE 2","color":"purple","rows":[["Press pallof","3×10 (1)",""],["Incline kettle","3×10 (1)",""],["Cruch poulie","3×10 (1)",""],["Extention colone","3×10 (1)",""]]}],"Samedi":[{"label":"SEANCE 1","color":"red","rows":[["Disosiation du pied","3×10",""],["Inversion eversion","3×10",""],["flexion plantaire","3×10",""],["impact au sol","3×10",""]]}],"Dimanche":[{"label":"SEANCE 1","color":"red","rows":[["Disosiation du pied","3×10",""],["Inversion eversion","3×10",""],["flexion plantaire","3×10",""],["impact au sol","3×10",""]]},{"label":"SEANCE 2","color":"green","rows":[["Course a pied","20-30 min","6:30 min/km"]]}]}};
const COLORS=['blue','red','green','purple'];const KEY='sport_s1_colores_v1';let state=load();function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{return JSON.parse(localStorage.getItem(KEY))||clone(DEFAULT)}catch(e){return clone(DEFAULT)}}function e(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const b=document.querySelector('#board');b.innerHTML='';state.days.forEach((day,di)=>{const col=document.createElement('article');col.className='day';col.innerHTML=`<div class="day-head"><i class="dot"></i><span class="day-name">${e(day)}</span><span class="day-sub">Día ${di+1}</span></div><div class="sessions"></div><button class="add-session">＋ Añadir sesión</button>`;const wrap=col.querySelector('.sessions');state.schedule[day].forEach((s,si)=>{const box=document.createElement('div');box.className='session '+(s.color||'blue');const dots=COLORS.map(c=>`<button class="color-dot ${c} ${s.color===c?'selected':''}" data-color="${c}" data-day="${day}" data-si="${si}" title="Color ${c}"></button>`).join('');let out=`<div class="session-title"><span class="title-edit" contenteditable data-label data-day="${day}" data-si="${si}">${e(s.label)}</span><span class="color-picker">${dots}</span></div><div class="cols"><div>Ejercicio</div><div>Volumen</div><div>Intensidad</div></div>`;s.rows.forEach((r,ri)=>out+=`<div class="entry"><div contenteditable data-cell data-day="${day}" data-si="${si}" data-ri="${ri}" data-fi="0">${e(r[0])}</div><div contenteditable data-cell data-day="${day}" data-si="${si}" data-ri="${ri}" data-fi="1">${e(r[1])}</div><div contenteditable data-cell data-day="${day}" data-si="${si}" data-ri="${ri}" data-fi="2">${e(r[2])}</div></div>`);out+=`<div class="session-footer"><button class="mini add-row" data-day="${day}" data-si="${si}">＋ Ejercicio</button><button class="mini remove del-session" data-day="${day}" data-si="${si}">Eliminar</button></div>`;box.innerHTML=out;wrap.appendChild(box)});col.querySelector('.add-session').onclick=()=>{state.schedule[day].push({label:'SEANCE '+(state.schedule[day].length+1),color:'blue',rows:[['','','']]});render()};b.appendChild(col)});document.querySelectorAll('[data-cell]').forEach(x=>x.oninput=()=>{let d=x.dataset;state.schedule[d.day][d.si].rows[d.ri][d.fi]=x.textContent});document.querySelectorAll('[data-label]').forEach(x=>x.oninput=()=>{let d=x.dataset;state.schedule[d.day][d.si].label=x.textContent});document.querySelectorAll('.color-dot').forEach(x=>x.onclick=()=>{let d=x.dataset;state.schedule[d.day][d.si].color=d.color;render()});document.querySelectorAll('.add-row').forEach(x=>x.onclick=()=>{let d=x.dataset;state.schedule[d.day][d.si].rows.push(['','','']);render()});document.querySelectorAll('.del-session').forEach(x=>x.onclick=()=>{let d=x.dataset;if(confirm('¿Eliminar esta sesión?')){state.schedule[d.day].splice(d.si,1);render()}})}
document.querySelector('#save').onclick=()=>{localStorage.setItem(KEY,JSON.stringify(state));document.querySelector('#message').textContent='✓ Cambios guardados en este dispositivo';setTimeout(()=>document.querySelector('#message').textContent='',2600)};document.querySelector('#reset').onclick=()=>{if(confirm('¿Restablecer el programa original?')){localStorage.removeItem(KEY);state=clone(DEFAULT);render()}};render();
</script>
</body>
</html>
